[build]
  command = "node _build/translate.mjs && node _build/build-all.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Dil klasörleri
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/ru"
  to = "/ru/index.html"
  status = 200

[[redirects]]
  from = "/ar"
  to = "/ar/index.html"
  status = 200

# Decap CMS SPA
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Temiz URL'ler (isteğe bağlı)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/catalogs/*"
  [headers.values]
    Content-Type = "application/pdf"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"
