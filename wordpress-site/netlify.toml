[build]
  command = "node _build/translate.mjs && node _build/build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Eski dil klasörleri → kök sayfa + dil parametresi (localStorage ile kalıcı)
[[redirects]]
  from = "/en/*"
  to = "/:splat?lang=en"
  status = 302

[[redirects]]
  from = "/ru/*"
  to = "/:splat?lang=ru"
  status = 302

[[redirects]]
  from = "/ar/*"
  to = "/:splat?lang=ar"
  status = 302

[[redirects]]
  from = "/en"
  to = "/index.html?lang=en"
  status = 302

[[redirects]]
  from = "/ru"
  to = "/index.html?lang=ru"
  status = 302

[[redirects]]
  from = "/ar"
  to = "/index.html?lang=ar"
  status = 302

# Decap CMS SPA
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Temiz URL'ler (isteğe bağlı)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/catalogs/*"
  [headers.values]
    Content-Type = "application/pdf"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"
