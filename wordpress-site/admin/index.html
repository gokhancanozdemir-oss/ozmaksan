<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>ÖZMAKSAN — İçerik Yönetimi</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS kendi "Netlify Identity ile Giriş" ekranını gösterir -->
  <script src="https://unpkg.com/decap-cms@^3.8.3/dist/decap-cms.js"></script>
  <script>
    (function () {
      function slugify(s) {
        return String(s || "")
          .toLowerCase()
          .replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s")
          .replace(/ı/g, "i").replace(/ö/g, "o").replace(/ç/g, "c")
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")
          .slice(0, 60) || "kayit";
      }
      function monthTr(iso) {
        var m = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
        var d = String(iso || "").slice(0, 10).split("-");
        if (d.length < 3) return iso || "";
        return Number(d[2]) + " " + m[Number(d[1]) - 1] + " " + d[0];
      }

      // Davet / şifre sıfırlama token'ı ana sayfada kalırsa buraya taşı
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.netlifyIdentity.on("login", function () {
              document.location.href = "/admin/";
            });
          }
        });
      }

      function registerHooks() {
        if (!window.CMS || !window.CMS.registerEventListener) return false;
        window.CMS.registerEventListener({
          name: "preSave",
          handler: function (_ref) {
            var entry = _ref.entry;
            var collection = entry.get("collection");
            var data = entry.get("data");
            if (collection === "products") {
              if (!data.get("slug")) data = data.set("slug", slugify(data.get("name")));
              return entry.set("data", data);
            }
            if (collection === "news") {
              if (!data.get("slug")) data = data.set("slug", slugify(data.get("title")));
              var d = data.get("date") || "";
              if (d && String(d).indexOf("T") >= 0) d = String(d).slice(0, 10);
              data = data.set("date", d).set("dateLabel", monthTr(d));
              return entry.set("data", data);
            }
            return entry;
          },
        });
        return true;
      }

      var tries = 0;
      var timer = setInterval(function () {
        tries += 1;
        if (registerHooks() || tries > 40) clearInterval(timer);
      }, 250);
    })();
  </script>
</body>
</html>
